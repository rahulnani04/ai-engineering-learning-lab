[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "banking-ai-learning-lab"
version = "0.1.0"
description = "Synthetic banking inquiry Python/FastAPI learning lab"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
